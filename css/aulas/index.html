<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
<title>CSS-PROJETO</title>
</head>
<body>
    <div class="wrapper">
     <section class="container-left">
     <h1>Easy Shopping Via Mobile</h1>
     <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Veritatis magni inventore delectus quam dicta, laborum obcaecati at distinctio reprehenderit! Ratione numquam illum quis dolore error est mollitia eveniet pariatur placeat!</p>
     <button>Get Started</button>
   </section>
    <section class="container-right">
    <header>
       <a>Home</a>
       <a>Work</a>
       <a>About</a>
       <a>Contact</a>
    </header>
     <img alt="girl-cellphone" src="./Illustration-3-3.png">
</section>
</div>
</body>
<style>


 * {
   margin: 0;
   padding: 0;
   box-sizing: border-box;
   font-family: "Oswald", sans-serif;
   font-weight: 400;

}

.wrapper {
      height: 100vh;
      width: 100vw;

}

.container-left {
    display: inline-block;
     width:60%;
     padding-left: 136px;
     margin-top: 20%;

}
.container-right {
     display: inline-block;
     background-color: rgba(93,93,125,0.16);
     height:100vh;
     width: 40%;
     position: absolute;
}
img{
    position: relative;
    top:25%;
    right:130px;
}
h1 {
    font-size: 78px;
    line-height: 80px;
    color:#5d5d7d;
    width: 368px;
}
p  {
    font-size: 28px;
    line-height: 48px;
    color:#5d5d7d;
    opacity:0.6;
    width: 540px;
}
button {
    width: 269px;
    height: 62px;
    background: #9499ea;
    box-shadow: 8px 10px 24px rgba(148,153,234,0.8979959);
    border:none;
    border-radius:30px;
    font-size: 24px;
    line-height:36px;
    text-align: center;
    color:#ffffff;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}
button:active {
    opacity: 0.65;
}
a  {
   font-size: 28px;
   line-height:41px;
   color:#5d5d7d;
   margin-right: 41px; 
}

a:nth-child(2) {
    opacity: 0.4;
}

a:active{
    opacity: 0.8;
}

header {
    margin:24px 0 0 57px;

}
@media screen and (max-width: 900px){
   .container-left {
    width:100%;
    height:50%;
    padding: 0;
    margin: 0;
   }
   .container-right {
   display:block;
   height: auto;
   width:100%;
   position: static;
   padding:48px;

   }
img {
    position: static;
    max-width: 90%;

}
 header {
    display: none;
 }

 h1  {
    font-size: 36px;
    line-height: 52px;
    width: auto;
    margin: 58px 50px 0 50px;
    text-align: center;
 }

 p {
    margin: 15px 40px;
    margin: auto;
    text-align: center;
    font-size:14px;
    line-height: 24px;
 }

button {
   margin: 0 auto;
    display: block;
              
}
@media screen and (max-width: 330px){
    .container-left {
       height:70%;
    }
}

}













</style>
</body>
</html>
